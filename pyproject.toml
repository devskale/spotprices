[project]
name = "spotprices"
version = "1.0.0"
description = "Electricity Tariff and Spot Price Analysis System"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
"test_*.py" = ["E402"]
